<script>
    let chartInstance = null;

    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        
        document.querySelectorAll('.nav-link').forEach(el => {
            el.classList.remove('active', 'text-silk-dark');
            el.classList.add('text-text/70');
        });
        
        const activeBtn = document.querySelector(`button[onclick="switchTab('${tabId}')"]`);
        if(activeBtn) {
            activeBtn.classList.remove('text-text/70');
            activeBtn.classList.add('active', 'text-silk-dark');
        }

        window.scrollTo({ top: 0, behavior: 'smooth' });
        if (tabId === 'results') initChart();
    }

    function scrollToTop() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    let isPlaying = false;
    const audio = document.getElementById('bg-music');
    
    function toggleAudio() {
        const iconPlay = document.getElementById('icon-play');
        const iconPause = document.getElementById('icon-pause');
        const audioText = document.getElementById('audio-text');
        
        if (isPlaying) {
            audio.pause();
            iconPlay.classList.remove('hidden');
            iconPause.classList.add('hidden');
            audioText.innerText = 'Phát nhạc nền';
        } else {
            audio.play();
            iconPlay.classList.add('hidden');
            iconPause.classList.remove('hidden');
            audioText.innerText = 'Tạm dừng nhạc';
        }
        isPlaying = !isPlaying;
    }

    function initChart() {
        if (chartInstance) return;
        const canvas = document.getElementById('evaluationChart');
        if (!canvas) return;
        
        const ctx = canvas.getContext('2d');
        const data = [
            { name: 'Nhận thức giá trị', score: 4.0, color: '#C4A47C' },
            { name: 'Kỳ vọng lợi ích', score: 3.7, color: '#C4A47C' },
            { name: 'Minh bạch thông tin', score: 2.8, color: '#C4A47C' },
            { name: 'Cơ hội & Vốn', score: 2.7, color: '#C4A47C' },
            { name: 'Tham gia thực hành*', score: 3.1, color: '#8B7355' },
            { name: 'Đề xuất sáng kiến*', score: 2.5, color: '#8B7355' },
            { name: 'Phối hợp & Niềm tin*', score: 3.3, color: '#6B7B56' },
            { name: 'Ảnh hưởng quyết định', score: 2.4, color: '#6B7B56' },
            { name: 'Tác động tổng hợp*', score: 3.2, color: '#A0522D' },
            { name: 'Mức độ hài lòng*', score: 3.4, color: '#A0522D' },
        ];

        chartInstance = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: data.map(d => d.name),
                datasets: [{
                    data: data.map(d => d.score),
                    backgroundColor: data.map(d => d.color),
                    borderRadius: 4,
                    barThickness: 24
                }]
            },
            options: {
                indexAxis: 'y',
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { min: 0, max: 5, grid: { color: '#EFEBE4' }, ticks: { color: '#8B7355' } },
                    y: { grid: { display: false }, ticks: { color: '#4A3B32', font: { family: '"Cormorant Garamond", serif', size: 14 } } }
                }
            }
        });
    }

    // Render Tài liệu tham khảo
    const refs = [
        { id: '01', text: 'Arnstein, S. R. (1969). A ladder of citizen participation. Journal of the American Institute of Planners, 35(4), 216–224.', link: 'https://doi.org/10.1080/01944366908977225', group: 'Nhóm 1. Khung lý thuyết và đánh giá sự tham gia' },
        { id: '02', text: 'Benedjma, I., & Mahimoud, A. (2021). Applying the MOA model... Journal of Cultural Heritage Management, 11(1), 18–38.', link: 'https://doi.org/10.1108/JCHMSD-08-2018-0055', group: 'Nhóm 1. Khung lý thuyết và đánh giá sự tham gia' },
        { id: '03', text: 'Bộ Văn hóa, Thể thao và Du lịch. (2024). Thái Bình khai thác kho tàng di sản...', link: 'https://bvhttdl.gov.vn/', group: 'Nhóm 3. Bối cảnh di sản và phát triển du lịch tại Việt Nam' }
    ];

    const groups = [...new Set(refs.map(r => r.group))];
    const container = document.getElementById('references-container');
    
    if (container) {
        groups.forEach(group => {
            let html = `<div class="bg-white p-8 rounded-sm shadow-sm border border-cream-dark mb-6"><h4 class="font-serif font-bold text-lg text-lotus mb-4 border-b border-cream-dark pb-2">${group}</h4><ul class="space-y-4">`;
            refs.filter(r => r.group === group).forEach(ref => {
                html += `<li class="text-sm font-light leading-relaxed hover:bg-cream p-3 rounded-sm border-l-2 border-transparent hover:border-silk"><span class="font-medium text-silk-dark">${ref.id}.</span> ${ref.text}<br><a href="${ref.link}" class="text-silk hover:underline break-all" target="_blank">${ref.link}</a></li>`;
            });
            container.innerHTML += html + '</ul></div>';
        });
    }
</script>
